[package]
name = "ote-designcraft-headless"
description = "Headless DesignCraft engine for OTEManager: command scripts, PDF/IDML/native export and page previews in WebAssembly"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Pinned to the same upstream release as the server CLI (v0.9.0), so
# browser and server builds compose identical command scripts identically.
[dependencies]
designcraft-engine = { git = "https://github.com/storytold/designcraft", rev = "7cb8b12507def48fb9346e5004340b5e8e4cfcb7" }
designcraft-render = { git = "https://github.com/storytold/designcraft", rev = "7cb8b12507def48fb9346e5004340b5e8e4cfcb7" }
designcraft-fonts = { git = "https://github.com/storytold/designcraft", rev = "7cb8b12507def48fb9346e5004340b5e8e4cfcb7" }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.129"

# Upstream's workspace patches, which a dependent build must repeat: craft-pdf
# requires the vendored, unwind-safe krilla, and the PDF reader the patched hayro.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8", version = "=0.8.2" }
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
